name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - name: Coverage
        run: node --test --experimental-test-coverage ledger/**/*.test.mjs tests/*.test.mjs 2>&1 || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web && npm install && npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan for secret values
        run: node --test tests/secret-scan.test.mjs
      - uses: actions/checkout@v4
      - run: grep -rn "MEMWAL_PRIVATE_KEY\|GROQ_API_KEY\|ghp_\|sk-\|suiprivkey" --include="*.mjs" --include="*.ts" --include="*.tsx" --include="*.js" . && exit 1 || echo "No secrets found"
