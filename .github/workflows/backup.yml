name: db-backup
on:
  schedule: [{ cron: '17 3 * * 0' }]
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump
        env: { DB: '${{ secrets.DATABASE_URL_DIRECT }}' }
        run: |
          test -n "$DB" || { echo "DATABASE_URL_DIRECT not set, skipping"; exit 0; }
          pg_dump --no-owner --format=custom "$DB" -f vow.dump
      - uses: actions/upload-artifact@v4
        if: hashFiles('vow.dump') != ''
        with: { name: vow-db-backup, path: vow.dump, retention-days: 30 }
