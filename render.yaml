services:
  - type: web
    name: vow-discord-gateway
    runtime: node
    plan: free
    rootDir: apps/discord-gateway
    buildCommand: npm install
    startCommand: node worker.mjs
    healthCheckPath: /
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: VOW_API_URL
        value: https://vow-livid.vercel.app
