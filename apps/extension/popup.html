<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head><body>
<header><img src="icons/32.png" alt=""><b>vow</b><span id="who"></span></header>
<section><label>Remember</label><textarea id="text" rows="3" placeholder="A fact you want Vow to keep"></textarea>
<button id="save">Save to memory</button></section>
<section><label>Recall</label><div class="row"><input id="q" placeholder="What did I note about..."><button id="find">Find</button></div><ul id="out"></ul></section>
<details id="cfg"><summary>Settings</summary>
<label>Vow URL</label><input id="base"><label>Agent token</label><input id="token" type="password"><label>Role</label><input id="role" placeholder="e.g. study">
<button id="store">Save settings</button></details>
<p id="msg"></p><script type="module" src="popup.js"></script></body></html>
