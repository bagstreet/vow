<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vow — offline</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#020303;color:#f3f5f6;font-family:system-ui,sans-serif;text-align:center;padding:40px}
    .ring{width:60px;height:60px;border-radius:50%;border:3px solid #0E9C86;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
    .dot{width:20px;height:20px;border-radius:50%;background:#0E9C86}
    h1{font-size:22px;margin:0 0 10px}
    p{font-size:14px;color:#a1a9ae;max-width:360px;margin:0 auto;line-height:1.6}
  </style>
</head>
<body>
  <div>
    <div class="ring"><div class="dot"></div></div>
    <h1>You're offline</h1>
    <p>Vow needs a connection to load your dashboard, send messages, and update reminders. Reconnect and reload — nothing you entered here is lost.</p>
  </div>
</body>
</html>
